# Fase 2 (teste): animação grátis na GPU do Kaggle. Só roda quando disparado à mão; não mexe no robô diário.
# Segredo necessário: só ROBO_TOKEN. A chave do Kaggle fica no Cloudflare (o site faz a ponte).
# O resultado fica como "artifact" por 3 dias (precisa estar logado no GitHub para baixar).
name: Kaggle teste

on:
  workflow_dispatch:
    inputs:
      so_acompanhar:
        description: '1 = não envia de novo ao Kaggle, só acompanha e baixa a última versão'
        default: '0'

concurrency: kaggle-teste

permissions:
  contents: write

jobs:
  animar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Animar 4 cenas no Kaggle
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
          SO_ACOMPANHAR: ${{ github.event.inputs.so_acompanhar || '0' }}
        run: bash kaggle/teste.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-teste
          path: /tmp/amostra/
          retention-days: 3
          if-no-files-found: ignore
      # cópia leve no branch "amostras" (dá para baixar sem login e publicar no site)
      - name: Publicar amostra leve no branch amostras
        if: success()
        run: |
          ffmpeg -y -loglevel error -i /tmp/amostra/kaggle-teste.mp4 -vf scale=720:1280 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart /tmp/kaggle-teste.mp4
          git config user.name "cenaria-robo"; git config user.email "robo@cenariavideos.com"
          git checkout --orphan amostras-tmp
          git rm -rfq . ; cp /tmp/kaggle-teste.mp4 . ; cp /tmp/amostra/relatorio.json . 2>/dev/null || true
          git add kaggle-teste.mp4 relatorio.json; git commit -qm "amostra kaggle $(date -u +%F' '%H:%M)"
          git push -fq origin HEAD:amostras
