# Robô do Cenaria: todo dia ~12h (Brasília, disparado pela tarefa do Claude) monta os 3 vídeos de AMANHÃ (8h, 17h, 20h) e guarda no cofre (R2).
# Às 16h47 o Claude pede a aprovação no celular: dá tempo de recusar e pedir outro vídeo na véspera.
# Repositório público = minutos ilimitados no GitHub Actions. Aqui só tem a rotina: nenhuma chave, nenhum código do site.
# Nada fica salvo aqui: sem "artifacts"; o computador do GitHub é apagado ao terminar.
name: Cenaria robô

on:
  # Sem "schedule": o agendamento do GitHub atrasava horas. Quem dispara às 11h53 (Brasília)
  # é a tarefa agendada do Claude "Cenaria: disparar o robô" (via API, na hora certa).
  workflow_dispatch:       # disparo pela tarefa do Claude ou pelo botão "Run workflow"
    inputs:
      qtd:
        description: 'Quantos vídeos'
        default: '3'

concurrency: robo

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Chrome, Playwright e ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/robo && cp rodar.mjs /tmp/robo/ && cd /tmp/robo
          echo '{"type":"module"}' > package.json
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chrome
      - name: Montar e enviar os vídeos
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
          QTD: ${{ github.event.inputs.qtd || '3' }}
        working-directory: /tmp/robo
        run: node rodar.mjs
