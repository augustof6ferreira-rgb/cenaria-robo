# Robô do Cenaria: todo dia ~12h (Brasília, disparado pela tarefa do Claude) monta os 3 vídeos de AMANHÃ (8h, 17h, 20h) e guarda no cofre (R2).
# Às 16h47 o Claude pede a aprovação no celular: dá tempo de recusar e pedir outro vídeo na véspera.
# Repositório público = minutos ilimitados no GitHub Actions. Aqui só tem a rotina: nenhuma chave, nenhum código do site.
# Nada fica salvo aqui: sem "artifacts"; o computador do GitHub é apagado ao terminar.
name: Cenaria robô

on:
  # Sem "schedule": o agendamento do GitHub atrasava horas. Quem dispara às 2h56 (Brasília, madrugada)
  # é o cron do Cloudflare (site cenaria), que também confere e tenta de novo até 6h30.
  workflow_dispatch:       # disparo pela tarefa do Claude ou pelo botão "Run workflow"
    inputs:
      qtd:
        description: 'Quantos vídeos'
        default: '2'
      modo:
        description: 'vazio = robô diário; "vitrine" = só o vídeo de apresentação da landing (publica no branch vitrine)'
        default: ''

concurrency: robo

permissions:
  contents: write

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Chrome, Playwright e ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/robo && cp rodar.mjs /tmp/robo/ && cd /tmp/robo
          echo '{"type":"module"}' > package.json
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chrome
      - name: Montar e enviar os vídeos
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
          QTD: ${{ github.event.inputs.qtd || '2' }}
          MODO: ${{ github.event.inputs.modo || '' }}
        working-directory: /tmp/robo
        run: node rodar.mjs
      - name: Publicar a vitrine no branch vitrine
        if: ${{ success() && github.event.inputs.modo == 'vitrine' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "cenaria-robo"; git config user.email "robo@cenariavideos.com"
          git checkout --orphan vitrine-tmp
          git rm -rfq . ; cp /tmp/vitrine-final.mp4 vitrine.mp4; git add vitrine.mp4
          git commit -qm "vitrine $(date -u +%F' '%H:%M)"; git push -fq origin HEAD:vitrine
